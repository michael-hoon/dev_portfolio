<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 128 128">
    <defs>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="128" height="128" fill="#111" rx="16"/>
    <!-- Minimalist geometric design: overlapping hexagon and circle -->
    <circle cx="64" cy="64" r="28" fill="none" stroke="#8c5cf5" stroke-width="4" filter="url(#glow)" opacity="0.8"/>
    <path d="M 64 32 L 82 42 L 82 62 L 64 72 L 46 62 L 46 42 Z" fill="none" stroke="#8c5cf5" stroke-width="4" filter="url(#glow)"/>
    <circle cx="64" cy="64" r="8" fill="#8c5cf5" filter="url(#glow)"/>
    <style>
        rect { fill: #111; }
        circle, path { stroke: #8c5cf5; }
        circle:last-of-type { fill: #8c5cf5; }
        @media (prefers-color-scheme: light) {
            rect { fill: #f8f8f8; }
            circle, path { stroke: #7c4ce5; }
            circle:last-of-type { fill: #7c4ce5; }
        }
    </style>
</svg>
